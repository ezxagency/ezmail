<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift Card</title>
<meta name="theme-color" content="#2D006B">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0F0C1B;
  --ink-soft:#7B2CBF;
  --paper:#F8F9FA;
  --card:#ffffff;
  --edge:#E4D6F5;
  --active:#7B2CBF;
  --break:#2D006B;
  --idle:#9B4DDB;

  --mint-100:#CFFCF6;
  --mint-200:#9FF9ED;
  --mint-300:#5FF5E1;
  --mint-400:#00F5D4;
  --mint-500:#00C7AC;

  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --cond:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:100%}
body{
  background:#F8F9FA;
  color:var(--ink);font-family:var(--body);overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}

.app{
  display:flex;flex-direction:column;height:100dvh;width:min(100%,380px);max-width:380px;margin:0 auto;position:relative;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border-left:1px solid rgba(255,255,255,.4);border-right:1px solid rgba(255,255,255,.4);
  animation:appIn .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- status band ---------- */
.band{
  padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;
  background:rgba(45,0,107,.85);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  color:#fff;transition:background .25s ease;
  border-bottom:1px solid rgba(255,255,255,.15);
  position:relative;
}
.band[data-s="ACTIVE"]{
  background:rgba(123,44,191,.85);
  animation:glowPulse 2.6s ease-in-out infinite;
}
.band[data-s="ON_BREAK"]{background:rgba(123,44,191,.85)}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 rgba(123,44,191,0)}
  50%{box-shadow:0 8px 32px rgba(123,44,191,.4)}
}
.band[data-s="ACTIVE"] ~ .stage .clock-time{text-shadow:0 0 20px rgba(123,44,191,.3)}
.band-signout{
  position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;
  font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .15s ease;
}
.band-signout:hover{background:rgba(255,255,255,.28)}
.band-state{
  display:block;font-family:var(--cond);font-weight:700;font-size:24px;
  letter-spacing:.04em;text-transform:uppercase;line-height:1.05;
}
.band-meta{
  display:block;margin-top:4px;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;opacity:.9;
}

/* ---------- dual clock ---------- */
.stage{flex:1;min-height:0;overflow:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}
.clock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 0 4px}
.clock-panel{
  padding:18px 12px;border:1px solid rgba(255,255,255,.5);border-radius:18px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 18px 36px rgba(15,12,27,.1);text-align:center;
}
.clock-label{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;
  font-size:10px;color:var(--ink-soft);font-weight:700;
}
.clock-time{
  font-family:var(--mono);font-weight:700;
  font-size:28px;letter-spacing:-.02em;line-height:1;
  margin-top:10px;font-variant-numeric:tabular-nums;
}
@media (max-width:360px){ .clock-time{font-size:25px} }
@media (max-width:320px){ .clock-time{font-size:21px} }
.clock-meta{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.shiftbar{
  display:flex;justify-content:center;gap:10px;align-items:baseline;
  margin-top:0;padding-top:12px;border-top:1px solid var(--edge);
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);
  letter-spacing:.04em;min-height:22px;
}
.shiftbar b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- punch card ---------- */
.card{
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-radius:26px;position:relative;padding:18px 18px 12px;flex:1;
  box-shadow:0 22px 34px rgba(15,12,27,.1);
}
.card::before{
  content:"";position:absolute;top:-1px;left:0;right:0;height:10px;
  background:radial-gradient(circle at 5px 0, transparent 4px, rgba(228,214,245,.95) 4px 5px, transparent 5px) 0 0/14px 10px repeat-x;
  opacity:.95;
}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;
  font-size:11px;font-weight:700;color:var(--ink-soft);
  padding-bottom:12px;border-bottom:1px solid rgba(228,214,245,.9);
}
.link{
  background:none;border:0;padding:4px 0 4px 12px;
  font:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;
  color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
.punches{list-style:none;margin:0;padding:0}
.punches li{
  display:flex;gap:10px;align-items:baseline;padding:14px 0;
  border-bottom:1px dashed rgba(228,214,245,.8);font-family:var(--mono);font-size:13px;
}
.punches li:last-child{border-bottom:0}
.punch-t{font-weight:700;font-variant-numeric:tabular-nums}
.punch-k{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;
  font-size:10px;font-weight:700;padding:4px 8px;
  border:1px solid rgba(228,214,245,.9);border-radius:999px;color:var(--ink-soft);white-space:nowrap;
}
.punch-k.k-task{border-color:var(--ink);color:var(--ink)}
.punch-k.k-break{border-color:var(--break);color:var(--break)}
.punch-k.k-store{border-color:var(--idle);color:var(--idle)}
.punch-n{color:var(--ink-soft);flex:1;text-align:right;font-size:12px}
.stamp-in{animation:stamp .22s cubic-bezier(.2,.9,.3,1.4)}
@keyframes stamp{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.empty{padding:28px 4px 30px;color:var(--ink-soft);font-size:14px;line-height:1.6}

/* ---------- dock ---------- */
.dock{
  padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px;
  min-height:clamp(132px,30vh,170px);justify-content:flex-end;border-top:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
}
.btn{
  width:100%;border:0;border-radius:14px;padding:18px 16px;position:relative;overflow:hidden;
  font-family:var(--cond);font-weight:700;font-size:17px;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  background:#2D006B;color:#fff;
  transition:transform .12s ease,opacity .15s ease,background .2s ease,box-shadow .2s ease;
}
.btn:active{transform:scale(.984)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn-go{background:#00F5D4;color:var(--ink);box-shadow:0 12px 22px rgba(0,245,212,.35)}
.btn-go::after{
  content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent);
  transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;
}
@keyframes shine{0%,10%{left:-60%}55%,100%{left:130%}}
.btn-break{background:#2D006B;box-shadow:0 12px 22px rgba(45,0,107,.3)}
.btn-ghost{
  background:rgba(255,255,255,.65);color:var(--ink);border:1.5px solid rgba(255,255,255,.6);
  backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);
  box-shadow:0 8px 18px rgba(15,12,27,.08);
}
.btn-wa{background:#00C7AC;color:var(--ink);box-shadow:0 12px 22px rgba(0,199,172,.3)}
.btn-sm{padding:14px 12px;font-size:15px;letter-spacing:.07em}
.btn[disabled]{opacity:.34;cursor:not-allowed}
.row{display:flex;gap:10px}
.row .btn{flex:1}

@media (hover:hover){
  .btn:not([disabled]):hover{transform:translateY(-2px)}
  .btn-go:not([disabled]):hover{box-shadow:0 16px 30px rgba(123,44,191,.4)}
  .btn-ghost:not([disabled]):hover{background:rgba(255,255,255,.55)}
  .clock-panel{transition:transform .18s ease,box-shadow .18s ease}
  .clock-panel:hover{transform:translateY(-3px);box-shadow:0 22px 40px rgba(15,12,27,.14)}
}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,12,27,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.85);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-bottom:0;
  border-radius:18px 18px 0 0;transform:translateY(101%);
  transition:transform .26s cubic-bezier(.2,.7,.3,1);
  max-width:380px;margin:0 auto;max-height:92dvh;overflow-y:auto;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  box-shadow:0 -20px 48px rgba(15,12,27,.18);
}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:999px;background:var(--edge);margin:6px auto 16px}
.sheet h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:20px;margin:0 0 6px;font-weight:700}
.sheet .hint{margin:0 0 18px;color:var(--ink-soft);font-size:14px;line-height:1.45}
.req{color:var(--break)}

label.fld{display:block;margin-bottom:16px}
label.fld > span{
  display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;
}
input[type=text],select,textarea{
  width:100%;font-family:var(--body);font-size:16px;padding:16px 14px;
  border:1px solid rgba(255,255,255,.6);border-radius:14px;background:rgba(255,255,255,.9);color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
textarea{min-height:110px;resize:vertical;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(123,44,191,.28);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{
  border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;
  padding:12px 16px;font-family:var(--cond);font-weight:700;font-size:14px;
  letter-spacing:.02em;cursor:pointer;transition:transform .14s ease,background .2s ease,border-color .2s ease,color .2s ease;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.chip:hover{transform:translateY(-1px);background:rgba(123,44,191,.14)}
.chip[aria-pressed=true]{background:#00F5D4;color:var(--ink);border-color:transparent}
.chip[disabled]{opacity:.35;cursor:not-allowed}

.stars{display:flex;gap:8px;margin-bottom:8px}
.star{
  flex:1;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.75);border-radius:14px;padding:14px 0;
  cursor:pointer;font-family:var(--mono);font-size:18px;color:var(--ink);
  transition:background .2s ease,border-color .2s ease,color .2s ease;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.star:hover{border-color:var(--ink)}
.star[aria-pressed=true]{background:#00F5D4;color:var(--ink);border-color:transparent}

.preview{
  background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:16px;
  margin-bottom:16px;font-family:var(--mono);font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tally{list-style:none;margin:0 0 18px;padding:0}
.tally li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(228,214,245,.75);font-family:var(--mono);font-size:13px}
.tally li b{font-weight:700}

.hist{list-style:none;margin:0 0 18px;padding:0}
.hist li{border-bottom:1px solid rgba(228,214,245,.9);padding:14px 0;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.hist .h-c{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.02em}
.hist .h-d{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.hist .h-h{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:rgba(15,12,27,.75);color:#fff;padding:13px 20px;border-radius:999px;
  font-family:var(--cond);letter-spacing:.06em;font-size:14px;font-weight:600;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  opacity:0;pointer-events:none;transition:.22s ease;z-index:80;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop layout ---------- */
@media (min-width:820px){
  body{padding:32px 16px}
  .app{
    display:grid;
    grid-template-columns:340px 1fr;
    grid-template-rows:auto auto auto auto;
    grid-template-areas:
      "band band"
      "clock card"
      "shiftbar card"
      "dock card";
    column-gap:28px;row-gap:0;
    width:min(94vw,880px);max-width:880px;
    max-height:min(90vh,720px);
    margin:0 auto;
    border-radius:28px;overflow:hidden;
    box-shadow:0 40px 90px rgba(15,12,27,.22);
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid rgba(255,255,255,.4);
  }
  .band{grid-area:band}
  .stage{display:contents}
  .clock{grid-area:clock;padding:22px 20px 0}
  .clock-panel{padding:16px 10px}
  .clock-time{font-size:24px}
  .shiftbar{grid-area:shiftbar;padding:0 24px 20px}
  .card{grid-area:card;flex:none;height:auto;margin:22px 24px 22px 0;overflow-y:auto}
  .dock{grid-area:dock;min-height:auto;padding:0 24px 26px}

  .grab{display:none}
  .sheet{
    left:0;right:0;top:0;bottom:0;margin:auto;
    width:min(92vw,440px);height:max-content;max-height:86vh;
    border-radius:20px;
    transform:translateY(12px) scale(.98);opacity:0;pointer-events:none;
    transition:transform .22s ease,opacity .2s ease;
    box-shadow:0 30px 70px rgba(15,12,27,.28);
    padding:22px 22px calc(env(safe-area-inset-bottom) + 22px);
  }
  .sheet.on{transform:none;opacity:1;pointer-events:auto}
}

/* ---------- fine details ---------- */
.stage,.card,.sheet{scrollbar-width:thin;scrollbar-color:rgba(123,44,191,.4) transparent}
.stage::-webkit-scrollbar,.card::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:6px}
.stage::-webkit-scrollbar-thumb,.card::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:rgba(123,44,191,.4);border-radius:999px}
.stage::-webkit-scrollbar-track,.card::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- login / admin ---------- */
.hidden{display:none!important}
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{
  width:min(100%,360px);background:rgba(255,255,255,.75);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-radius:26px;padding:28px 24px;
  box-shadow:0 30px 60px rgba(15,12,27,.18);
}
.login-card h1{font-family:var(--cond);font-size:22px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.login-card .hint{margin:0 0 20px}
.login-err{color:#b91c1c;font-size:13px;margin:-8px 0 14px;line-height:1.4}

.admin-wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.admin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px}
.admin-title{display:block;font-family:var(--cond);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.admin-sub{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:2px}
.admin-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.admin-row{
  background:rgba(255,255,255,.7);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  box-shadow:0 14px 26px rgba(15,12,27,.08);transition:transform .15s ease;
}
.admin-row:hover{transform:translateY(-2px)}
.admin-row .a-name{font-family:var(--cond);font-weight:700;font-size:16px}
.admin-row .a-email{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.admin-row .a-right{text-align:right}
.admin-row .a-status{font-family:var(--cond);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border-radius:999px;display:inline-block}
.admin-row .a-status.st-idle{background:rgba(155,77,219,.18);color:var(--ink-soft)}
.admin-row .a-status.st-active{background:rgba(123,44,191,.22);color:var(--active)}
.admin-row .a-status.st-break{background:rgba(45,0,107,.18);color:var(--break)}
</style>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>Ez Agency</h1>
    <p class="hint" id="loginHint">Sign in to clock in and out.</p>
    <p id="loginErr" class="login-err hidden"></p>
    <label class="fld"><span>Email</span><input type="email" id="loginEmail" autocomplete="username"></label>
    <label class="fld"><span>Password</span><input type="password" id="loginPass" autocomplete="current-password"></label>
    <label class="fld hidden" id="confirmWrap"><span>Confirm password</span><input type="password" id="loginPass2" autocomplete="new-password"></label>
    <button class="btn btn-go" id="loginBtn">Sign in</button>
    <button class="link" id="modeToggle" style="display:block;margin:14px auto 0;text-align:center">New here? Create an account</button>
  </div>
</div>

<div id="adminScreen" class="admin-wrap hidden">
  <header class="admin-head">
    <div><span class="admin-title">Team dashboard</span><span class="admin-sub" id="adminSub"></span></div>
    <button class="btn btn-ghost btn-sm" id="adminLogout" style="width:auto">Sign out</button>
  </header>
  <ul class="admin-list" id="adminList"></ul>
</div>

<div class="app hidden" id="appScreen">
  <header class="band" id="band" data-s="IDLE">
    <span class="band-state" id="bandState">Clocked out</span>
    <span class="band-meta" id="bandMeta">Not on shift</span>
    <button type="button" class="band-signout hidden" id="bandSignOut">Sign out</button>
  </header>

  <main class="stage">
    <div class="clock">
      <div class="clock-panel">
        <div class="clock-label">Shift clock</div>
        <div class="clock-time" id="shiftClock">00:00:00</div>
        <div class="clock-meta" id="shiftMeta">Ready</div>
      </div>
      <div class="clock-panel">
        <div class="clock-label">Task clock</div>
        <div class="clock-time" id="taskClock">00:00:00</div>
        <div class="clock-meta" id="taskMeta">Idle</div>
      </div>
    </div>
    <div class="shiftbar" id="shiftbar"></div>

    <section class="card">
      <div class="card-head">
        <span>Today's card</span>
        <button class="link" id="btnHistory">History</button>
      </div>
      <ul class="punches" id="punches"></ul>
      <div class="empty" id="empty">No punches yet. Clock in to start the card.</div>
    </section>
  </main>

  <footer class="dock" id="dock"></footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — edit these four things and nothing else.
   ============================================================ */
const CONFIG = {
  // The team's WhatsApp group invite link (Group info > Invite via link).
  // WhatsApp doesn't support pre-filling text into a group chat, so the
  // report text is auto-copied to the clipboard when this link opens —
  // the worker just pastes it once inside the chat.
  whatsappGroupLink: "https://chat.whatsapp.com/Kyqbe2xXvQxHK9OkIfWXTy",

  clients: [
    "Store Alpha", "Store Beta", "Store Gamma",
    "Store Delta", "Store Epsilon", "Store Zeta"
  ],

  // Keep this list SHORT (5-6). Long task lists kill accuracy.
  tasks: [
    "Copy", "Design", "Task Review", "Task Assign", "Embed"
  ],

  pauseReasons: ["Lunch", "Travel", "Meeting", "Other"]
};

/* ============================================================
   FIREBASE — paste your project's config below.
   Get it from Firebase console > Project settings > Your apps.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDmSVB6MWWCA_dqdQIrGoZxFSA_fw1OcqY",
  authDomain: "ez-agency-timeclock.firebaseapp.com",
  projectId: "ez-agency-timeclock",
  storageBucket: "ez-agency-timeclock.firebasestorage.app",
  messagingSenderId: "233171568445",
  appId: "1:233171568445:web:883b9f8038b3a346762754"
};
// First login using this email is automatically made admin.
const ADMIN_EMAIL = "ezagency2nd@gmail.com";

const FB_READY = !firebaseConfig.apiKey.includes("PASTE");
let auth = null, db = null;
if (FB_READY) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

/* ============================================================
   STORAGE — per-user document in Firestore
   ============================================================ */
const Store = (() => {
  let uid = null, email = null;
  function setUser(u, e) { uid = u; email = e; }
  async function read() {
    if (!uid) return null;
    try {
      const doc = await db.collection("appState").doc(uid).get();
      return doc.exists && doc.data().json ? JSON.parse(doc.data().json) : null;
    } catch (e) { console.error(e); return null; }
  }
  async function write(v) {
    if (!uid) return;
    try {
      await db.collection("appState").doc(uid).set({
        json: JSON.stringify(v), email, name: v.worker || null, updatedAt: Date.now()
      });
    } catch (e) { console.error(e); }
  }
  return { read, write, setUser };
})();

/* ============================================================
   STATE
   shift = { client, startedAt,
             segs:  [{ task, startedAt, endedAt, via }],   // via: start|switch|resume
             breaks:[{ reason, startedAt, endedAt }] }
   Invariant: while ACTIVE exactly one open seg; while ON_BREAK none.
   Therefore  sum(segs) === net working time, always.
   ============================================================ */
let S = { worker:"", status:"IDLE", shift:null, history:[], lastReport:null };

const $ = id => document.getElementById(id);
const save = () => Store.write(S);
const esc = s => String(s).replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));

const pad = n => String(n).padStart(2,"0");
const clock = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dayStamp = ts => new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});

function hms(ms){ const s = Math.max(0, Math.floor(ms/1000));
  return pad(Math.floor(s/3600)) + ":" + pad(Math.floor(s/60)%60) + ":" + pad(s%60); }
function humanDur(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s + "s";
  const m = Math.round(s/60);
  return m < 60 ? m + "m" : Math.floor(m/60) + "h " + pad(m%60) + "m";
}

const openSeg   = sh => (sh.segs || []).find(s => !s.endedAt);
function taskClockMs(sh, now = Date.now()) {
  if (!sh) return 0;
  return (sh.segs || []).reduce((total, seg) => total + segMs(seg, now), 0);
}
const openBreak = sh => (sh.breaks || []).find(b => !b.endedAt);
const breakMs = (sh, now = Date.now()) => (sh.breaks||[]).reduce((t,b)=>t+((b.endedAt||now)-b.startedAt),0);
const netMs   = (sh, end = Date.now()) => (end - sh.startedAt) - breakMs(sh, end);
const segMs   = (s, now = Date.now()) => (s.endedAt || now) - s.startedAt;
const currentStore = sh => {
  const segs = sh.segs || [];
  for (let i = segs.length - 1; i >= 0; i--) if (segs[i].client) return segs[i].client;
  return sh.client;
};

function taskTally(sh, now = Date.now()){
  const m = new Map();
  let store = sh.client;
  (sh.segs||[]).forEach(s => {
    if (s.client) store = s.client;
    const key = store + "␀" + s.task;
    const cur = m.get(key) || { store, task: s.task, ms: 0 };
    cur.ms += segMs(s, now);
    m.set(key, cur);
  });
  return [...m.values()].sort((a,b) => b.ms - a.ms);
}
const taskLabel = t => (t.store||"").toUpperCase() + " " + t.task.toUpperCase() + " WORK";

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const st = S.status;
  $("band").dataset.s = st;

  if (st === "IDLE"){
    $("bandState").textContent = "Clocked out";
    $("bandMeta").textContent  = S.worker ? S.worker.toUpperCase() : "Not on shift";
    $("shiftMeta").textContent = "Ready";
    $("taskMeta").textContent = "Idle";
  } else if (st === "ACTIVE"){
    const seg = openSeg(S.shift);
    $("bandState").textContent = "Clocked in";
    $("bandMeta").textContent  = currentStore(S.shift).toUpperCase();
    $("shiftMeta").textContent = "Net working";
    $("taskMeta").textContent = seg ? seg.task : "Current task";
  } else {
    const b = openBreak(S.shift);
    $("bandState").textContent = "On break";
    $("bandMeta").textContent  = (b.reason||"Break").toUpperCase() + " · " + currentStore(S.shift).toUpperCase();
    $("shiftMeta").textContent = "Net working";
    $("taskMeta").textContent = "Paused";
  }

  renderDock();
  renderPunches();
  tick();
}

function renderDock(){
  const d = $("dock"); d.innerHTML = "";
  const mk = (label, cls, fn) => {
    const b = document.createElement("button");
    b.className = "btn " + cls; b.textContent = label; b.onclick = fn; return b;
  };

  if (S.status === "IDLE"){
    d.append(mk("Clock in", "btn-go", askClockIn));
  } else if (S.status === "ACTIVE"){
    d.append(mk("Switch task", "", askSwitch));
    const row = document.createElement("div"); row.className = "row";
    row.append(mk("Pause", "btn-break btn-sm", askPause), mk("Clock out", "btn-ghost btn-sm", askWrapUp));
    d.append(row);
  } else {
    const last = [...(S.shift.segs||[])].pop();
    d.append(mk("Resume · " + (last ? last.task : "work"), "btn-go", resume));
    d.append(mk("Clock out", "btn-ghost btn-sm", askWrapUp));
  }
}

function renderPunches(){
  const ul = $("punches"), sh = S.shift;
  ul.innerHTML = "";
  $("empty").style.display = sh ? "none" : "block";
  if (!sh) return;

  const ev = [];
  ev.push({ t: sh.startedAt, k: "In", cls: "", n: sh.client });
  (sh.segs||[]).forEach(s => {
    if (s.via === "switch") ev.push({ t: s.startedAt, k: "Task", cls: "k-task", n: s.task });
    if (s.client) ev.push({ t: s.startedAt, k: "Store", cls: "k-store", n: s.client });
  });
  (sh.breaks||[]).forEach(b => {
    ev.push({ t: b.startedAt, k: "Break", cls: "k-break", n: b.reason });
    if (b.endedAt){
      const back = (sh.segs||[]).find(s => s.via === "resume" && s.startedAt === b.endedAt);
      ev.push({ t: b.endedAt, k: "Resume", cls: "", n: (back ? back.task + " · " : "") + humanDur(b.endedAt - b.startedAt) });
    }
  });
  ev.sort((a,b) => a.t - b.t);

  ev.forEach(e => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="punch-t">${clock(e.t)}</span>`
      + `<span class="punch-k ${e.cls}">${e.k}</span>`
      + `<span class="punch-n">${esc(e.n || "")}</span>`;
    ul.append(li);
  });
  if (ul.lastElementChild) ul.lastElementChild.classList.add("stamp-in");
}

function tick(){
  const bar = $("shiftbar");
  if (S.status === "IDLE"){
    $("shiftClock").textContent = "00:00:00";
    $("taskClock").textContent = "00:00:00";
    bar.innerHTML = "";
    return;
  }

  const sh = S.shift, now = Date.now();
  const shiftMs = netMs(sh, now);
  const taskMs = taskClockMs(sh, now);

  $("shiftClock").textContent = hms(shiftMs);
  $("taskClock").textContent = hms(taskMs);

  if (S.status === "ACTIVE"){
    bar.innerHTML = `<span>Task</span> <b>${humanDur(taskMs)}</b>`
      + (breakMs(sh, now) ? ` <span>· break ${humanDur(breakMs(sh, now))}</span>` : "");
  } else {
    bar.innerHTML = `<span>Shift</span> <b>${humanDur(shiftMs)}</b> <span>· paused</span>`;
  }
}

/* ============================================================
   SHEETS
   ============================================================ */
function openSheet(html, setup){
  $("sheetBody").innerHTML = html;
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
  if (setup) setup();
}
function closeSheet(){ $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
$("scrim").onclick = () => {};   // gated: tapping outside never skips a required field

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 2100); }

function chipGroup(list, allowOther){
  return list.map(x => `<button type="button" class="chip" data-v="${esc(x)}" aria-pressed="false">${esc(x)}</button>`).join("")
    + (allowOther ? `<button type="button" class="chip" data-v="__other" aria-pressed="false">Other…</button>` : "");
}
function wireChips(onPick){
  const chips = $("sheetBody").querySelectorAll(".chip");
  chips.forEach(c => c.onclick = () => {
    chips.forEach(x => x.setAttribute("aria-pressed","false"));
    c.setAttribute("aria-pressed","true");
    onPick(c.dataset.v);
  });
}
const OTHER_RE = /^[A-Za-z0-9][A-Za-z0-9 .\-#]{1,39}$/;

/* ---------- worker name (once) ---------- */
function askName(){
  openSheet(`
    <h2>Who's on shift?</h2>
    <p class="hint">Your name goes on every report sent to the office. Asked once on this phone.</p>
    <label class="fld"><span>Your name <b class="req">*</b></span>
      <input type="text" id="nm" autocomplete="name" placeholder="e.g. John Smith"></label>
    <button class="btn btn-go" id="ok" disabled>Save name</button>
  `, () => {
    const nm = $("nm"), ok = $("ok");
    nm.oninput = () => ok.disabled = nm.value.trim().length < 2;
    ok.onclick = async () => { S.worker = nm.value.trim(); await save(); closeSheet(); render(); };
    nm.focus();
  });
}

/* ---------- Clock in: store + first task (both mandatory) ---------- */
function askClockIn(){
  openSheet(`
    <h2>Clock in</h2>
    <p class="hint">Store decides who gets billed. Task starts the second clock.</p>

    <label class="fld"><span>Store <b class="req">*</b></span>
      <input type="text" id="cl" autocomplete="organization" placeholder="Enter store name"></label>

    <label class="fld"><span>Starting task <b class="req">*</b></span></label>
    <div class="chips">${chipGroup(CONFIG.tasks, true)}</div>
    <label class="fld" id="tkOtherWrap" style="display:none"><span>Task name <b class="req">*</b></span>
      <input type="text" id="tkOther" placeholder="Short name"></label>

    <button class="btn btn-go" id="ok" disabled>Start shift</button>
    <button class="btn btn-ghost btn-sm" id="cancel">Back</button>
  `, () => {
    let task = "";
    const cl=$("cl");
    const tkOther=$("tkOther"), tkWrap=$("tkOtherWrap"), ok=$("ok");

    const store = () => cl.value.trim();
    const taskV = () => task === "__other" ? tkOther.value.trim() : task;
    const valid = () => {
      const sOk = OTHER_RE.test(store());
      const tOk = task === "__other" ? OTHER_RE.test(taskV()) : !!task;
      return sOk && tOk;
    };
    const sync = () => ok.disabled = !valid();

    cl.oninput = sync;
    tkOther.oninput = sync;
    wireChips(v => { task = v; tkWrap.style.display = v === "__other" ? "block" : "none"; if (v==="__other") tkOther.focus(); sync(); });

    $("cancel").onclick = closeSheet;
    ok.onclick = async () => {
      const now = Date.now();
      S.shift = { client: store(), startedAt: now, segs: [], breaks: [] };
      S.shift.segs.push({ task: taskV(), startedAt: now, endedAt: null, via: "start" });
      S.status = "ACTIVE";
      await save(); closeSheet(); render();
    };
  });
}

/* ---------- Switch task (mandatory) ---------- */
function askSwitch(){
  const seg = openSeg(S.shift);
  const cur = seg.task;
  const curStore = currentStore(S.shift);
  openSheet(`
    <h2>Switch task</h2>
    <p class="hint">Still on the clock — this only splits your time. Currently on <b>${esc(cur)}</b> for ${humanDur(segMs(seg))} at <b>${esc(curStore)}</b>.</p>
    <label class="fld"><span>New task <b class="req">*</b></span></label>
    <div class="chips">${chipGroup(CONFIG.tasks, true)}</div>
    <label class="fld" id="tkOtherWrap" style="display:none"><span>Task name <b class="req">*</b></span>
      <input type="text" id="tkOther" placeholder="Short name"></label>

    <label class="fld"><span>Store <span style="text-transform:none;font-weight:600;color:var(--ink-soft)">— optional, leave blank to stay at ${esc(curStore)}</span></span>
      <input type="text" id="cl" autocomplete="organization" placeholder="Enter store name"></label>

    <button class="btn" id="ok" disabled>Switch</button>
    <button class="btn btn-ghost btn-sm" id="cancel">Back</button>
  `, () => {
    let task = "";
    const tkOther=$("tkOther"), tkWrap=$("tkOtherWrap"), cl=$("cl"), ok=$("ok");

    const taskV = () => task === "__other" ? tkOther.value.trim() : task;
    const storeV = () => cl.value.trim();
    const valid = () => {
      const tOk = task === "__other" ? OTHER_RE.test(taskV()) : !!task;
      const sv = storeV();
      const sOk = !sv || OTHER_RE.test(sv);
      const changed = taskV() !== cur || (sv && sv !== curStore);
      return tOk && sOk && changed;
    };
    const sync = () => ok.disabled = !valid();

    tkOther.oninput = sync;
    cl.oninput = sync;
    wireChips(v => { task = v; tkWrap.style.display = v === "__other" ? "block" : "none"; if (v==="__other") tkOther.focus(); sync(); });

    $("cancel").onclick = closeSheet;
    ok.onclick = async () => {
      const now = Date.now();
      seg.endedAt = now;
      const newStore = storeV();
      const seg2 = { task: taskV(), startedAt: now, endedAt: null, via: "switch" };
      if (newStore && newStore !== curStore){ seg2.client = newStore; }
      S.shift.segs.push(seg2);
      await save(); closeSheet(); render();
      toast("Now on " + taskV() + (seg2.client ? " · " + seg2.client : ""));
    };
  });
}

/* ---------- Pause (mandatory reason) ---------- */
function askPause(){
  openSheet(`
    <h2>Take a break</h2>
    <p class="hint">The task clock stops too. Break time is subtracted from your hours.</p>
    <label class="fld"><span>Reason <b class="req">*</b></span></label>
    <div class="chips">${chipGroup(CONFIG.pauseReasons.filter(r=>r!=="Other"), true)}</div>
    <label class="fld" id="otherWrap" style="display:none"><span>What for? <b class="req">*</b></span>
      <input type="text" id="oth" placeholder="Short note"></label>
    <button class="btn btn-break" id="ok" disabled>Start break</button>
    <button class="btn btn-ghost btn-sm" id="cancel">Back</button>
  `, () => {
    let picked = "";
    const ok=$("ok"), wrap=$("otherWrap"), oth=$("oth");
    const val = () => picked === "__other" ? oth.value.trim() : picked;
    const sync = () => ok.disabled = !(picked && (picked !== "__other" || OTHER_RE.test(val())));
    oth.oninput = sync;
    wireChips(v => { picked = v; wrap.style.display = v === "__other" ? "block" : "none"; if (v==="__other") oth.focus(); sync(); });
    $("cancel").onclick = closeSheet;
    ok.onclick = async () => {
      const now = Date.now();
      openSeg(S.shift).endedAt = now;                       // task clock stops with the shift clock
      S.shift.breaks.push({ reason: val(), startedAt: now, endedAt: null });
      S.status = "ON_BREAK";
      await save(); closeSheet(); render();
    };
  });
}

async function resume(){
  const now = Date.now();
  const b = openBreak(S.shift); b.endedAt = now;
  const last = [...S.shift.segs].pop();
  S.shift.segs.push({ task: last.task, startedAt: now, endedAt: null, via: "resume" });
  S.status = "ACTIVE";
  await save(); render();
}

/* ---------- Clock out (wrap-up + rating, both mandatory) ---------- */
function askWrapUp(){
  const sh = S.shift, now = Date.now();
  const tally = taskTally(sh, now)
    .map(t => `<li><span>${esc(taskLabel(t))}</span><b>${humanDur(t.ms)}</b></li>`).join("");

  openSheet(`
    <h2>Wrap up</h2>
    <p class="hint">Your task clocks for this shift:</p>
    <ul class="tally">${tally}</ul>
    <label class="fld"><span>Anything to add? <b class="req">*</b></span>
      <textarea id="note" placeholder="Anything left open, anything blocking you."></textarea></label>
    <label class="fld"><span>Rate your day <b class="req">*</b></span></label>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-n="${n}" aria-pressed="false">${n}</button>`).join("")}</div>
    <p class="hint">1 = rough day · 5 = everything clicked</p>
    <button class="btn btn-go" id="ok" disabled>Close shift</button>
    <button class="btn btn-ghost btn-sm" id="cancel">Back</button>
  `, () => {
    let rating = 0;
    const note = $("note"), ok = $("ok");
    const sync = () => ok.disabled = !(note.value.trim().length >= 3 && rating > 0);
    $("sheetBody").querySelectorAll(".star").forEach(s => s.onclick = () => {
      rating = +s.dataset.n;
      $("sheetBody").querySelectorAll(".star").forEach(x => x.setAttribute("aria-pressed", +x.dataset.n <= rating));
      sync();
    });
    note.oninput = sync;
    $("cancel").onclick = closeSheet;
    ok.onclick = () => closeShift(note.value.trim(), rating);
  });
}

async function closeShift(note, rating){
  const now = Date.now(), sh = S.shift;

  const b = openBreak(sh); if (b) b.endedAt = now;          // clocking out mid-break closes it
  const s = openSeg(sh);   if (s) s.endedAt = now;

  const rec = {
    worker: S.worker, client: sh.client,
    startedAt: sh.startedAt, endedAt: now,
    breakMs: breakMs(sh, now), netMs: netMs(sh, now),
    segs: sh.segs, breaks: sh.breaks, note, rating
  };

  S.history.unshift(rec);
  S.lastReport = rec;
  S.shift = null; S.status = "IDLE";
  await save(); closeSheet(); render();
  showReport(rec);
}

/* ---------- Report + WhatsApp ---------- */
function copyTextSync(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "-9999px";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function reportText(r){
  const tasks = taskTally(r, r.endedAt).map(t => `  · ${taskLabel(t)} — ${humanDur(t.ms)}`).join("\n");
  const brk = r.breaks.filter(b=>b.endedAt)
    .map(b => `  · ${b.reason} ${clock(b.startedAt)}–${clock(b.endedAt)} (${humanDur(b.endedAt-b.startedAt)})`).join("\n");
  const lbl = s => (s + ":").padEnd(17);

  return [
    "SHIFT REPORT", dayStamp(r.startedAt), "",
    lbl("Team member") + r.worker,
    lbl("Store") + r.client,
    lbl("Clock In Time") + clock(r.startedAt),
    lbl("Clock Out Time") + clock(r.endedAt),
    lbl("Total worked") + humanDur(r.netMs),
    lbl("Break") + (r.breakMs ? humanDur(r.breakMs) : "none"),
    brk || null, "",
    "TASKS", tasks, "",
    "Rating: " + r.rating + "/5", "",
    "Notes:", r.note
  ].filter(x => x !== null).join("\n");
}

function showReport(r){
  const txt = reportText(r);
  openSheet(`
    <h2>Shift closed</h2>
    <p class="hint">Send it to the group now. It's also saved here for the Excel export.</p>
    <div class="preview">${esc(txt)}</div>
    <button class="btn btn-wa" id="wa">Send on WhatsApp</button>
    <button class="btn btn-ghost btn-sm" id="cp">Copy text</button>
    <button class="btn btn-ghost btn-sm" id="dn">Done</button>
  `, () => {
    $("wa").onclick = () => {
      const ok = copyTextSync(txt);
      toast(ok ? "Copied — paste it in the group" : "Opening group — copy the text above first");
      window.open(CONFIG.whatsappGroupLink, "_blank");
    };
    $("cp").onclick = () => {
      toast(copyTextSync(txt) ? "Copied" : "Copy failed — select the text above");
    };
    $("dn").onclick = closeSheet;
  });
}

/* ---------- History + Excel ---------- */
function showHistory(){
  const rows = S.history.length ? S.history.map(r => `
    <li>
      <div>
        <div class="h-c">${esc(r.client)}</div>
        <div class="h-d">${dayStamp(r.startedAt)} · ${clock(r.startedAt)}–${clock(r.endedAt)} · ${taskTally(r, r.endedAt).length} task${taskTally(r,r.endedAt).length===1?"":"s"} · ${r.rating}/5</div>
      </div>
      <div class="h-h">${humanDur(r.netMs)}</div>
    </li>`).join("") : `<div class="empty">No closed shifts yet.</div>`;

  const total = S.history.reduce((t,r) => t + r.netMs, 0);

  openSheet(`
    <h2>History</h2>
    <p class="hint">${S.history.length} shift${S.history.length===1?"":"s"} · ${humanDur(total)} net worked</p>
    <ul class="hist">${rows}</ul>
    <button class="btn" id="xl" ${S.history.length ? "" : "disabled"}>Export to Excel</button>
    <button class="btn btn-ghost btn-sm" id="dn">Close</button>
  `, () => {
    $("xl").onclick = exportExcel; $("dn").onclick = closeSheet;
  });
}

function exportExcel(){
  const shifts = S.history.map(r => ({
    "Date": dayStamp(r.startedAt),
    "Team Member": r.worker,
    "Store": r.client,
    "Clock In Time": clock(r.startedAt),
    "Clock Out Time": clock(r.endedAt),
    "Break (min)": Math.round(r.breakMs/60000),
    "Total Worked (hrs)": +(r.netMs/3600000).toFixed(2),
    "Rating": r.rating,
    "Notes": r.note
  }));

  const detail = [];
  S.history.forEach(r => {
    let store = r.client;
    (r.segs||[]).filter(s=>s.endedAt).forEach(s => {
      if (s.client) store = s.client;
      detail.push({
        "Date": dayStamp(r.startedAt),
        "Team Member": r.worker,
        "Store": store,
        "Task": taskLabel({ store, task: s.task }),
        "Start": clock(s.startedAt),
        "End": clock(s.endedAt),
        "Minutes": Math.round(segMs(s)/60000),
        "Hours": +(segMs(s)/3600000).toFixed(2)
      });
    });
  });

  const name = "shifts-" + new Date().toISOString().slice(0,10);

  if (window.XLSX){
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(shifts);
    ws1["!cols"] = [{wch:14},{wch:16},{wch:16},{wch:9},{wch:10},{wch:11},{wch:10},{wch:7},{wch:48}];
    const ws2 = XLSX.utils.json_to_sheet(detail);
    ws2["!cols"] = [{wch:14},{wch:16},{wch:16},{wch:18},{wch:8},{wch:8},{wch:9},{wch:8}];
    XLSX.utils.book_append_sheet(wb, ws1, "Shifts");
    XLSX.utils.book_append_sheet(wb, ws2, "Task Detail");
    XLSX.writeFile(wb, name + ".xlsx");
    toast("Excel file downloaded");
    return;
  }

  const csv = rows => {
    const head = Object.keys(rows[0]);
    const q = v => `"${String(v).replace(/"/g,'""')}"`;
    return [head.join(",")].concat(rows.map(r => head.map(h => q(r[h])).join(","))).join("\n");
  };
  const dl = (rows, suffix) => {
    if (!rows.length) return;
    const url = URL.createObjectURL(new Blob(["\ufeff"+csv(rows)], {type:"text/csv"}));
    const a = document.createElement("a"); a.href = url; a.download = name + suffix + ".csv"; a.click();
    URL.revokeObjectURL(url);
  };
  dl(shifts, "-shifts"); dl(detail, "-tasks");
  toast("CSV files downloaded");
}

$("btnHistory").onclick = showHistory;

/* ============================================================
   WORKER APP BOOT (called once, after login as a worker)
   ============================================================ */
let workerStarted = false;
async function startWorkerApp(){
  if (workerStarted) return;
  workerStarted = true;

  const saved = await Store.read();
  if (saved) S = Object.assign(S, saved);

  // repair a state corrupted by a crash mid-shift
  if (S.status !== "IDLE" && !S.shift) S.status = "IDLE";
  if (S.status === "ACTIVE"   && S.shift && !openSeg(S.shift))   S.status = "IDLE";
  if (S.status === "ON_BREAK" && S.shift && !openBreak(S.shift)) S.status = "ACTIVE";

  render();
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

  if (FB_READY) {
    $("bandSignOut").classList.remove("hidden");
    $("bandSignOut").onclick = () => auth.signOut();
  }

  if (!S.worker) askName();
}

/* ============================================================
   AUTH + ADMIN
   ============================================================ */
function screen(show){
  $("loginScreen").classList.toggle("hidden", show !== "login");
  $("appScreen").classList.toggle("hidden", show !== "app");
  $("adminScreen").classList.toggle("hidden", show !== "admin");
}

async function startAdmin(email){
  screen("admin");
  $("adminSub").textContent = email;
  const list = $("adminList");
  list.innerHTML = `<li class="empty">Loading…</li>`;
  try {
    const snap = await db.collection("appState").get();
    list.innerHTML = "";
    if (snap.empty){ list.innerHTML = `<li class="empty">No workers have signed in yet.</li>`; return; }
    snap.forEach(doc => {
      const data = doc.data();
      let s; try { s = JSON.parse(data.json); } catch { s = null; }
      if (!s) return;
      const statusCls = s.status === "ACTIVE" ? "st-active" : s.status === "ON_BREAK" ? "st-break" : "st-idle";
      const todayKey = dayStamp(Date.now());
      let todayMs = (s.history||[]).filter(r => dayStamp(r.startedAt) === todayKey).reduce((t,r)=>t+r.netMs,0);
      if (s.shift && s.status !== "IDLE") todayMs += netMs(s.shift);
      const li = document.createElement("li");
      li.className = "admin-row";
      li.innerHTML = `
        <div><div class="a-name">${esc(s.worker || data.email || "Unnamed")}</div><div class="a-email">${esc(data.email||"")}</div></div>
        <div class="a-right"><span class="a-status ${statusCls}">${esc((s.status||"").replace("_"," "))}</span><div class="a-email" style="margin-top:6px">${humanDur(todayMs)} today</div></div>
      `;
      li.onclick = () => viewWorker(data, s);
      list.append(li);
    });
  } catch (e) {
    console.error(e);
    list.innerHTML = `<li class="empty">Couldn't load team data — check Firestore rules allow admin reads.</li>`;
  }
}

function viewWorker(data, s){
  const hist = s.history || [];
  const rows = hist.length ? hist.map(r => `
    <li>
      <div>
        <div class="h-c">${esc(r.client)}</div>
        <div class="h-d">${dayStamp(r.startedAt)} · ${clock(r.startedAt)}–${clock(r.endedAt)} · ${taskTally(r, r.endedAt).length} task${taskTally(r,r.endedAt).length===1?"":"s"} · ${r.rating}/5</div>
      </div>
      <div class="h-h">${humanDur(r.netMs)}</div>
    </li>`).join("") : `<div class="empty">No closed shifts yet.</div>`;
  const total = hist.reduce((t,r) => t + r.netMs, 0);

  openSheet(`
    <h2>${esc(s.worker || data.email || "Worker")}</h2>
    <p class="hint">${hist.length} shift${hist.length===1?"":"s"} · ${humanDur(total)} net worked</p>
    <ul class="hist">${rows}</ul>
    <button class="btn" id="xl" ${hist.length ? "" : "disabled"}>Export to Excel</button>
    <button class="btn btn-ghost btn-sm" id="dn">Close</button>
  `, () => {
    $("xl").onclick = () => { const backup = S; S = s; exportExcel(); S = backup; };
    $("dn").onclick = closeSheet;
  });
}

async function resolveRole(user){
  const ref = db.collection("users").doc(user.uid);
  let doc = await ref.get();
  if (!doc.exists) {
    const role = (user.email||"").toLowerCase() === ADMIN_EMAIL.toLowerCase() ? "admin" : "worker";
    await ref.set({ email: user.email, role, createdAt: Date.now() });
    doc = await ref.get();
  }
  return doc.data().role;
}

if (!FB_READY){
  screen("login");
  $("loginErr").textContent = "Firebase isn't configured yet — paste your project's config into firebaseConfig near the top of the script.";
  $("loginErr").classList.remove("hidden");
  $("loginBtn").disabled = true;
} else {
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      screen("login");
      workerStarted = false;
      S = { worker:"", status:"IDLE", shift:null, history:[], lastReport:null };
      $("bandSignOut").classList.add("hidden");
      return;
    }
    try {
      const role = await resolveRole(user);
      if (role === "admin") { startAdmin(user.email); }
      else { Store.setUser(user.uid, user.email); screen("app"); startWorkerApp(); }
    } catch (e) {
      console.error(e);
      $("loginErr").textContent = "Signed in, but couldn't load your account. Check Firestore rules.";
      $("loginErr").classList.remove("hidden");
    }
  });

  let loginMode = "signin";
  function setLoginMode(mode){
    loginMode = mode;
    const isSignup = mode === "signup";
    $("confirmWrap").classList.toggle("hidden", !isSignup);
    $("loginBtn").textContent = isSignup ? "Create account" : "Sign in";
    $("loginHint").textContent = isSignup ? "Set up your login — you'll use this every time." : "Sign in to clock in and out.";
    $("modeToggle").textContent = isSignup ? "Already have an account? Sign in" : "New here? Create an account";
    $("loginErr").classList.add("hidden");
  }
  $("modeToggle").onclick = () => setLoginMode(loginMode === "signin" ? "signup" : "signin");

  const AUTH_ERRORS = {
    "auth/email-already-in-use": "That email already has an account — sign in instead.",
    "auth/invalid-email": "That doesn't look like a valid email.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/user-not-found": "No account with that email.",
    "auth/wrong-password": "Wrong password.",
    "auth/invalid-credential": "Wrong email or password."
  };
  async function doLogin(){
    const email = $("loginEmail").value.trim();
    const pass = $("loginPass").value;
    $("loginErr").classList.add("hidden");
    if (!email || !pass) return;
    try {
      if (loginMode === "signup") {
        if (pass.length < 6) throw new Error("Password must be at least 6 characters.");
        if (pass !== $("loginPass2").value) throw new Error("Passwords don't match.");
        await auth.createUserWithEmailAndPassword(email, pass);
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
    } catch (e) {
      $("loginErr").textContent = AUTH_ERRORS[e.code] || e.message || "Something went wrong — try again.";
      $("loginErr").classList.remove("hidden");
    }
  }
  $("loginBtn").onclick = doLogin;
  $("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("adminLogout").onclick = () => auth.signOut();
}
</script>
