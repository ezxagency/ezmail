<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shift Card</title>
<!-- This used to be a byte-identical copy of index.html, kept in sync by
     hand for people who bookmarked the old URL - and every deploy risked
     the two drifting apart. Now it just forwards them. The script keeps
     the query AND the #/hash route so old bookmarks land exactly where
     they pointed; the meta refresh is the no-JS fallback (which loses the
     hash, but the app needs JS anyway). Relative "./" on purpose: it
     works on the custom domain and on the bare github.io path alike.
     NEVER copy index.html over this file again. -->
<script>location.replace("./" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=./">
<p style="font:15px/1.6 -apple-system,'Segoe UI',Arial,sans-serif;padding:24px">
  This page moved — <a href="./">open EZ Clock In</a>.
</p>
