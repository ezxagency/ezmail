<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password — Shift Card</title>
<meta name="theme-color" content="#F2ECDD">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<div id="loginScreen" class="login-wrap">
  <div class="sc-col">
    <div class="sc-header">
      <div class="sc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M7 3c0 5.5 4 6.5 5 8-1 1.5-5 2.5-5 8M17 3c0 5.5-4 6.5-5 8 1 1.5 5 2.5 5 8"/></svg>
      </div>
      <h1 class="sc-title">Shift Card</h1>
      <p class="sc-subtitle" id="stepHint">Choose a new password.</p>
    </div>

    <div class="login-card">
      <p id="loginErr" class="login-err hidden"></p>

      <p id="loadingState" style="text-align:center;color:var(--sc-muted);font-family:var(--body);margin:8px 0">Checking your link…</p>

      <form id="resetForm" class="hidden">
        <label class="sc-fld"><span>New password</span>
          <div class="sc-input-wrap"><input type="password" id="newPass" autocomplete="new-password"></div>
        </label>
        <label class="sc-fld"><span>Confirm new password</span>
          <div class="sc-input-wrap"><input type="password" id="newPass2" autocomplete="new-password"></div>
        </label>
        <button type="submit" class="sc-btn-go" id="saveBtn"><span>Save password</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div id="successState" class="hidden">
        <p style="text-align:center;color:var(--sc-ink);font-family:var(--body);margin:8px 0 20px">Your password has been updated.</p>
        <a class="sc-btn-go" href="index.html" style="text-decoration:none"><span>Back to sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <div id="invalidState" class="hidden">
        <p style="text-align:center;color:var(--sc-ink);font-family:var(--body);margin:8px 0 20px">This reset link is invalid or has expired.</p>
        <a class="sc-btn-go" href="index.html" style="text-decoration:none"><span>Back to sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDmSVB6MWWCA_dqdQIrGoZxFSA_fw1OcqY",
    authDomain: "ez-agency-timeclock.firebaseapp.com",
    projectId: "ez-agency-timeclock",
    storageBucket: "ez-agency-timeclock.firebasestorage.app",
    messagingSenderId: "233171568445",
    appId: "1:233171568445:web:883b9f8038b3a346762754"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const $ = id => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const mode = params.get("mode");
  const oobCode = params.get("oobCode");

  function show(id){
    ["loadingState","resetForm","successState","invalidState"].forEach(x => $(x).classList.toggle("hidden", x !== id));
  }

  (async () => {
    if (mode !== "resetPassword" || !oobCode) { show("invalidState"); return; }
    try {
      const email = await auth.verifyPasswordResetCode(oobCode);
      $("stepHint").textContent = "Set a new password for " + email;
      show("resetForm");
    } catch (e) {
      show("invalidState");
    }
  })();

  $("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginErr").classList.add("hidden");
    const p1 = $("newPass").value, p2 = $("newPass2").value;
    if (p1.length < 6) {
      $("loginErr").textContent = "Password must be at least 6 characters.";
      $("loginErr").classList.remove("hidden");
      return;
    }
    if (p1 !== p2) {
      $("loginErr").textContent = "Passwords don't match.";
      $("loginErr").classList.remove("hidden");
      return;
    }
    try {
      await auth.confirmPasswordReset(oobCode, p1);
      show("successState");
    } catch (e) {
      $("loginErr").textContent = e.message || "Couldn't reset password — the link may have expired.";
      $("loginErr").classList.remove("hidden");
    }
  });
</script>
