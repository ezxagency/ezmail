# Ships the server-side commit. Same shape as deploy-rules.yml and for
# the same reason: the thing that enforces the rules should not be
# deployed by hand from somebody's laptop.
name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

env:
  FIREBASE_PROJECT: ez-agency-timeclock

jobs:
  deploy:
    name: Verify, then deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps
        working-directory: tests
        run: npm ci

      # The function runs js/item-engine.js and js/permissions.js from
      # functions/shared/. The guard proves those copies have not drifted,
      # and the suites prove the engine they contain still behaves - so a
      # deploy cannot ship a server that decides differently from the
      # client the tests were written against.
      - name: Repo guards (including the functions/shared copies)
        run: node tests/repo-guards.test.mjs
      - name: Permissions grammar
        run: node tests/permissions.test.mjs
      - name: Item engine
        run: node tests/item-engine.test.mjs

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Check for credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set - nothing deployed."
          fi

      - name: Write credentials to disk
        if: steps.creds.outputs.present == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy commitItem
        if: steps.creds.outputs.present == 'true'
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT" --non-interactive

      - name: Shred credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
