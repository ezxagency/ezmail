# Runs the suites that already lived in tests/ but had nothing running them.
# Nothing here is new policy: the guards enforce README > "Conventions",
# and the rest are the project's own tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Pure node - no emulator, no browser. Finishes in seconds.
  unit:
    name: Unit tests + repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # Only the DOM suite needs anything installed (jsdom). The rest are
      # plain node - but they all run from one checkout, so one install.
      - name: Install test deps
        working-directory: tests
        run: npm ci

      # ONE step, the same command a contributor runs. A step per suite
      # rotted: eight suites (every redesign test and the flag test) were
      # green locally and never ran here.
      - name: npm test (every suite, in tests/package.json's order)
        working-directory: tests
        run: npm test

  # The allow/deny matrix in tests/firestore-rules.test.mjs. Needs
  # Java for the emulator jar, which is why this never ran by hand.
  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test deps
        working-directory: tests
        run: npm ci
      - name: Install firebase-tools
        run: npm i -g firebase-tools

      # cwd must be tests/ - the suite reads ../firestore.rules
      - name: Firestore rules allow/deny matrix
        working-directory: tests
        run: firebase emulators:exec --only firestore --project demo-ez "node firestore-rules.test.mjs"
